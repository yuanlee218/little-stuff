<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Stuff</title>
  <meta name="theme-color" content="#fbf6ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little Stuff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Little Stuff<span class="heart">♡</span></h1>
    <span id="aiStatus" class="pill"></span>
  </header>

  <main id="view"></main>

  <button id="addBtn" class="fab" aria-label="Add a little thing">＋</button>

  <nav class="tabs">
    <button data-tab="calendar"><span>📅</span>Calendar</button>
    <button data-tab="collection"><span>🧺</span>Collection</button>
    <button data-tab="recap"><span>🎉</span>Recap</button>
  </nav>

  <input type="file" id="fileInput" accept="image/*" hidden>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card" id="sheetBody"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
